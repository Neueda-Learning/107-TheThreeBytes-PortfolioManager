version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
#  Portfolio Manager – Docker Compose
#  Services: mysql (MySQL 8), backend (Spring Boot)
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "n3u3da!"
      MYSQL_DATABASE: portfolio_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Run schema + seed data on first start (only executed on a fresh volume)
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - portfolio_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pn3u3da!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    image: portfolio-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "n3u3da!"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8081
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8081:8081"
    networks:
      - portfolio_net

# ─── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: portfolio_mysql_data

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  portfolio_net:
    name: portfolio_network
    driver: bridge

