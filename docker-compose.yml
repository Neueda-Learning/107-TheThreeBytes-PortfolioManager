version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
#  Portfolio Manager – Docker Compose
#  Services: mysql (MySQL 8), backend (Spring Boot)
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── MySQL 8 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Run schema + seed data on first start (only executed on a fresh volume)
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - portfolio_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    image: portfolio-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-com.mysql.cj.jdbc.Driver}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: ${SERVER_PORT:-8081}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_API_BASE_URL: ${FINNHUB_API_BASE_URL:-https://finnhub.io/api/v1}
      FINNHUB_CACHE_QUOTE_TTL_SECONDS: ${FINNHUB_CACHE_QUOTE_TTL_SECONDS:-60}
      FINNHUB_CACHE_CANDLE_TTL_HOURS: ${FINNHUB_CACHE_CANDLE_TTL_HOURS:-24}
    ports:
      - "8081:8081"
    networks:
      - portfolio_net

# ─── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: portfolio_mysql_data

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  portfolio_net:
    name: portfolio_network
    driver: bridge

