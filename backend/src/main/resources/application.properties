spring.application.name=hsbcproject

# --- MySQL (override via env for local/dev/prod) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
server.error.include-message=always

# --- Finnhub API (used for STOCK tickers only) ---
finnhub.api.key=${FINNHUB_API_KEY:}
finnhub.api.base-url=${FINNHUB_API_BASE_URL:https://finnhub.io/api/v1}
finnhub.cache.quote-ttl-seconds=${FINNHUB_CACHE_QUOTE_TTL_SECONDS:60}
finnhub.cache.candle-ttl-hours=${FINNHUB_CACHE_CANDLE_TTL_HOURS:24}

# --- CORS (frontend dev server) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
